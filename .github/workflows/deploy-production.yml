name: Production deployment
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-push CI run ID
        type: string
        required: true
      dry_run:
        description: Verify prerequisites only; no production writes
        type: boolean
        default: true
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_DEPLOYMENTS_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENTS_ENABLED }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_WEB_ORIGIN: ${{ vars.PRODUCTION_WEB_ORIGIN }}
      PRODUCTION_API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}
      PRODUCTION_FALLBACK_API_ORIGIN: ${{ vars.PRODUCTION_FALLBACK_API_ORIGIN }}
      PRODUCTION_CUSTOMER_ORIGIN: ${{ vars.PRODUCTION_CUSTOMER_ORIGIN }}
      PUBLIC_FEATURE_COSTING_ENABLED: ${{ vars.PUBLIC_FEATURE_COSTING_ENABLED }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Install pinned deployment CLI in runner tooling only
        run: npm install --global vercel@62.2.0 --ignore-scripts
      - name: Verify artifact and existing Vercel target; dry run by default
        run: |
          args=(--run-id "$CI_RUN_ID")
          if [[ "$DRY_RUN" == "false" ]]; then args+=(--apply); fi
          python3 ci/deploy_web.py "${args[@]}"
