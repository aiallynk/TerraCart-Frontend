name: CI
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  checks:
    name: Checks (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        check: [lint, test, security]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Review scripts, lockfile and isolated environment
        run: python3 ci/checks.py preflight
      - name: Install locked dependencies without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Verify dependency lockfile was retained
        run: git diff --exit-code -- package-lock.json
      - name: Validate CI safety helpers
        if: matrix.check == 'test'
        run: python3 -m unittest discover -s ci/tests -p 'test_*.py'
      - name: Run reviewed check
        run: python3 ci/checks.py '${{ matrix.check }}'
      - name: Retain sanitized reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ matrix.check }}-${{ github.sha }}
          path: ci/reports/
          if-no-files-found: ignore
          retention-days: 14
  build:
    name: Build
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCTION_API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}
      PRODUCTION_FALLBACK_API_ORIGIN: ${{ vars.PRODUCTION_FALLBACK_API_ORIGIN }}
      PRODUCTION_CUSTOMER_ORIGIN: ${{ vars.PRODUCTION_CUSTOMER_ORIGIN }}
      PUBLIC_FEATURE_COSTING_ENABLED: ${{ vars.PUBLIC_FEATURE_COSTING_ENABLED }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Review scripts, lockfile and isolated environment
        run: python3 ci/checks.py preflight
      - name: Install locked dependencies without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Verify dependency lockfile was retained
        run: git diff --exit-code -- package-lock.json
      - name: Build immutable artifact without deployment
        run: python3 ci/checks.py build
      - name: Retain main artifact only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terracart-web-${{ github.sha }}
          path: |
            ci/artifacts/artifact.tar.gz
            ci/artifacts/artifact.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
